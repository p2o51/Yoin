name: Yoin
options:
  bundleIdPrefix: com.gpo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  Yoin:
    type: application
    platform: iOS
    sources:
      - path: Yoin
    info:
      path: Yoin/Info.plist
      properties:
        CFBundleDisplayName: Yoin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - google_sans_flex_400.ttf
          - google_sans_flex_500.ttf
          - google_sans_flex_600.ttf
          - google_sans_flex_700.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
