name: Yoin
options:
  bundleIdPrefix: com.gpo
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # Google Sign-In for Cloud sync (scope drive.appdata only). Client ID: Config/GoogleSignIn.xcconfig.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
  # Spotify App Remote (playback through the Spotify app), pinned: a binary SDK.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Simulator builds stay unsigned; device builds sign automatically with
    # 51's development team (a team ID, not a secret).
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
    DEVELOPMENT_TEAM: M75T74PTC4
    CODE_SIGN_STYLE: Automatic
targets:
  Yoin:
    type: application
    platform: iOS
    sources:
      - path: Yoin
    # YoinShared: the Kotlin Multiplatform :shared module (MCU, Palette,
    # YoinTokens, layout / colour algorithms) as a static XCFramework.
    # docs/shared-kmp.md.
    dependencies:
      - framework: ../shared/build/XCFrameworks/current/YoinShared.xcframework
        embed: false
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: SpotifyiOS
        product: SpotifyiOS
    configFiles:
      Debug: Config/GoogleSignIn.xcconfig
      Release: Config/GoogleSignIn.xcconfig
    preBuildScripts:
      # The scheme's build pre-action (below) runs Gradle before Xcode plans
      # the build; this phase only fails the build when the framework is
      # older than a Kotlin source (a failed or skipped Gradle run).
      - name: Check YoinShared (Kotlin) is current
        basedOnDependencyAnalysis: false
        script: |
          if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
          FW="$SRCROOT/../shared/build/XCFrameworks/current/YoinShared.xcframework/Info.plist"
          if [ ! -f "$FW" ]; then
            echo "error: YoinShared.xcframework is missing. Build once from Xcode (the scheme pre-action runs Gradle), or see iosApp/docs/shared-kmp.md."
            exit 1
          fi
          NEWER=$(find "$SRCROOT/../shared/src" "$SRCROOT/../shared/build.gradle.kts" -newer "$FW" -type f | head -1)
          if [ -n "$NEWER" ]; then
            echo "error: YoinShared.xcframework is older than $NEWER. Build again (the scheme pre-action runs Gradle), or see iosApp/docs/shared-kmp.md."
            exit 1
          fi
    info:
      path: Yoin/Info.plist
      properties:
        CFBundleDisplayName: Yoin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "10"
        # Only HTTPS and Apple's own crypto: no export compliance paperwork per build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - google_sans_flex_400.ttf
          - google_sans_flex_500.ttf
          - google_sans_flex_600.ttf
          - google_sans_flex_700.ttf
        # Native playback keeps playing with the screen off / app in the background.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # Self-hosted Subsonic / Navidrome servers are often plain http on a
          # LAN or a home IP, entered by the user at runtime, so ATS can't list
          # them ahead of time: allow arbitrary loads (plus local networking).
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Yoin streams music from servers on your local network.
        # MusicKit's authorization prompt (Apple Music library, catalog and playback).
        NSAppleMusicUsageDescription: Yoin plays and shows your Apple Music library.
        # Cloud sync's Google sign-in (Config/GoogleSignIn.xcconfig).
        GIDClientID: $(YOIN_GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(YOIN_GOOGLE_IOS_REVERSED_CLIENT_ID)
          # Spotify's sign-in and App Remote return here (yoin://auth/spotify/…, as on Android).
          - CFBundleURLName: com.gpo.yoin.auth
            CFBundleURLSchemes:
              - yoin
        # App Remote checks for (and opens) the Spotify app.
        LSApplicationQueriesSchemes:
          - spotify
        # The dev build's Spotify Client ID (Config/Spotify.local.xcconfig, not in git, as
        # Android's local.properties); Settings › Spotify overrides it at runtime.
        YoinSpotifyClientID: $(YOIN_SPOTIFY_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin
        # The YoinShared check reads ../shared outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # YoinShared has iosArm64 + iosSimulatorArm64 slices only (no Intel
        # simulator), so generic simulator builds skip x86_64.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - YoinTests
      # Rebuilds ../shared/build/XCFrameworks/<debug or release>/YoinShared.xcframework
      # before Xcode plans the build (Gradle skips it when :shared is
      # unchanged). YOIN_SKIP_SHARED_BUILD=1 links the framework as is.
      preActions:
        - name: Build YoinShared (Kotlin)
          settingsTarget: Yoin
          script: |
            if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
            if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
            mkdir -p "$SRCROOT/build"
            # Release / Archive link the release framework, everything else the
            # debug one; Xcode always links XCFrameworks/current (a symlink).
            if [ "$CONFIGURATION" = "Release" ]; then FLAVOR=release; TASK=assembleYoinSharedReleaseXCFramework
            else FLAVOR=debug; TASK=assembleYoinSharedDebugXCFramework; fi
            cd "$SRCROOT/.." && ./gradlew --quiet ":shared:$TASK" > "$SRCROOT/build/yoin-shared-gradle.log" 2>&1
            ln -sfn "$FLAVOR" "$SRCROOT/../shared/build/XCFrameworks/current"
  # Yoin for Mac (P0, Subsonic only). Its own UI in YoinMac/, plus the
  # platform-neutral iOS files listed below (models, mapping, covers, colour,
  # player engine, audio cache, tokens, wavy progress).
  YoinMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: YoinMac
      - path: Yoin/Model/Models.swift
      - path: Yoin/Data/SubsonicMapping.swift
      - path: Yoin/Data/CoverArtwork.swift
      - path: Yoin/Data/Cache/AudioCache.swift
      - path: Yoin/Data/Cache/AudioCacheLoader.swift
      - path: Yoin/Data/Cache/SubsonicCacheKey.swift
      - path: Yoin/Playback/PlayerEngine.swift
      - path: Yoin/Playback/AudioOutput.swift
      - path: Yoin/Playback/AVAudioOutput.swift
      - path: Yoin/Playback/PlayableTrack.swift
      - path: Yoin/Theme/Tokens.swift
      - path: Yoin/Theme/TypeRoles.swift
      - path: Yoin/Theme/CoverScheme.swift
      - path: Yoin/Theme/Shapes.swift
      - path: Yoin/Theme/PlatformBridge.swift
      - path: Yoin/NowPlaying/WavyProgress.swift
      - path: Yoin/NowPlaying/SongFacts.swift
      - path: Yoin/Data/AppleMusicSource.swift
      - path: Yoin/Data/AppleMusicMapping.swift
      - path: Yoin/Playback/AppleMusicAudioOutput.swift
      - path: Yoin/Data/Cache/OfflineDownloads.swift
      - path: Yoin/Data/Cache/DetailDiskCache.swift
      - path: Yoin/Data/History/HistoryStore.swift
      - path: Yoin/Data/History/HomeHistory.swift
      - path: Yoin/Memories/MemoryDeck.swift
      - path: Yoin/Data/Sync/SyncDomainBridge.swift
      - path: Yoin/Data/Sync/SyncDomainBridge+PlaylistBackups.swift
      - path: Yoin/Data/Sync/CloudSync.swift
      - path: Yoin/Data/Spotify/SpotifyAuth.swift
      - path: Yoin/Data/Spotify/SpotifyDTOs.swift
      - path: Yoin/Data/Spotify/SpotifyMapping.swift
      - path: Yoin/Data/Spotify/SpotifySource.swift
      - path: Yoin/Data/Spotify/SpotifyWebAPI.swift
      - path: Yoin/Data/Spotify/SpotifySource+Playlists.swift
      - path: Yoin/Data/Spotify/SpotifySource+Search.swift
      - path: Yoin/Data/Spotify/SpotifyFake.swift
      - path: Yoin/Data/About/GeminiClient.swift
      - path: Yoin/Data/About/GeminiSettings.swift
      - path: Yoin/Data/About/SongAboutLoader.swift
      - path: Yoin/Data/About/SongAboutStore.swift
      - path: Yoin/Data/About/GeminiLyricsTranslation.swift
      - path: Yoin/Notes/LocalRatings.swift
      - path: Yoin/Notes/NotesStore.swift
      - path: Yoin/Data/Memories/AlbumMemoryStore.swift
      - path: Yoin/Data/NeoDB
      - path: Yoin/Album/AlbumNeoDBLine.swift
      - path: Yoin/Album/ScoreEmblem.swift
      - path: Yoin/Album/ScrapbookPaper.swift
      - path: Yoin/Library/LibrarySort.swift
      - path: Yoin/Library/NewestAlbumSongsPager.swift
      - path: Yoin/Playback/ScrobbleOutbox.swift
      - path: Yoin/Notes/NoteDraftStore.swift
      - path: Yoin/Landing/LandingMascot.swift
      - path: Yoin/Landing/LandingMascotPaths.swift
      - path: Yoin/Theme/YoinMarkPaths.swift
      - path: Yoin/Landing/LandingModels.swift
      - path: Yoin/Landing/LandingScenes.swift
      - path: Yoin/Theme/YoinFont.swift
      - path: Yoin/Resources/Fonts/google_sans_flex_variable.ttf
        buildPhase: resources
      - path: Yoin/Album/GrooveAward.swift
      - path: Yoin/Album/GrooveTilt.swift
      - path: Yoin/Data/Lyrics/LyricsTools.swift
      - path: Yoin/Home/HomeLayout.swift
      - path: Yoin/Data/Backup/PlaylistBackupStore.swift
      - path: Yoin/Data/Backup/PlaylistBackups.swift
      - path: Yoin/Data/Backup/PlaylistRestore.swift
      - path: Yoin/Data/Backup/SpotifyBackups.swift
      - path: Yoin/Settings/OpenSourceLicensesView.swift
      - path: Yoin/Resources/Licenses/license_apache_2_0.txt
        buildPhase: resources
      - path: Yoin/Resources/Licenses/license_ofl_1_1.txt
        buildPhase: resources
      - path: Yoin/YoinSymbols.xcassets
      - path: Yoin/AppIcon.icon
        buildPhase: resources
      - path: Yoin/Resources/Fonts/google_sans_flex_400.ttf
        buildPhase: resources
      - path: Yoin/Resources/Fonts/google_sans_flex_500.ttf
        buildPhase: resources
      - path: Yoin/Resources/Fonts/google_sans_flex_600.ttf
        buildPhase: resources
      - path: Yoin/Resources/Fonts/google_sans_flex_700.ttf
        buildPhase: resources
    dependencies:
      - framework: ../shared/build/XCFrameworks/current/YoinShared.xcframework
        embed: false
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Check YoinShared (Kotlin) is current
        basedOnDependencyAnalysis: false
        script: |
          if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
          FW="$SRCROOT/../shared/build/XCFrameworks/current/YoinShared.xcframework/Info.plist"
          if [ ! -f "$FW" ]; then
            echo "error: YoinShared.xcframework is missing. Build once from Xcode (the scheme pre-action runs Gradle), or see iosApp/docs/shared-kmp.md."
            exit 1
          fi
          NEWER=$(find "$SRCROOT/../shared/src" "$SRCROOT/../shared/build.gradle.kts" -newer "$FW" -type f | head -1)
          if [ -n "$NEWER" ]; then
            echo "error: YoinShared.xcframework is older than $NEWER. Build again (the scheme pre-action runs Gradle), or see iosApp/docs/shared-kmp.md."
            exit 1
          fi
    entitlements:
      path: YoinMac/YoinMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Google Sign-In keeps its tokens in the Keychain (Cloud sync); signed through the Mac profile.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.gpo.yoin.mac
    info:
      path: YoinMac/Info.plist
      properties:
        NSAppleMusicUsageDescription: Yoin plays and shows your Apple Music library.
        GIDClientID: $(YOIN_GOOGLE_MAC_CLIENT_ID)
        # Google's sign-in comes back here (Cloud sync).
        CFBundleURLTypes:
          - CFBundleURLName: com.gpo.yoin.mac.google
            CFBundleURLSchemes:
              - $(YOIN_GOOGLE_MAC_REVERSED_CLIENT_ID)
        YoinSpotifyClientID: $(YOIN_SPOTIFY_CLIENT_ID)
        CFBundleDisplayName: Yoin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          # Self-hosted Subsonic / Navidrome servers are often plain http on a LAN.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Yoin streams music from servers on your local network.
        # Handoff: what's playing, for the iOS app to pick up later (same team; no entitlement or domain).
        NSUserActivityTypes:
          - com.gpo.yoin.playing
        # Songs, albums and playlists dragged inside Yoin (their plain text goes to other apps).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.gpo.yoin.item
            UTTypeDescription: Yoin item
            UTTypeConformsTo:
              - public.data
    configFiles:
      Debug: Config/YoinMac.xcconfig
      Release: Config/YoinMac.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.mac
        PRODUCT_NAME: Yoin
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # YoinShared has a macos-arm64 slice only.
        EXCLUDED_ARCHS: x86_64
      configs:
        # The Mac development profile "Yoin Mac Development" (com.gpo.yoin.mac, team M75T74PTC4, this Mac):
        # the keychain-access-groups entitlement Google Sign-In needs is only signable with a profile.
        Debug:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: M75T74PTC4
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: Yoin Mac Development
    scheme:
      preActions:
        - name: Build YoinShared (Kotlin)
          settingsTarget: YoinMac
          script: |
            if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
            if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
            mkdir -p "$SRCROOT/build"
            if [ "$CONFIGURATION" = "Release" ]; then FLAVOR=release; TASK=assembleYoinSharedReleaseXCFramework
            else FLAVOR=debug; TASK=assembleYoinSharedDebugXCFramework; fi
            cd "$SRCROOT/.." && ./gradlew --quiet ":shared:$TASK" > "$SRCROOT/build/yoin-shared-gradle.log" 2>&1
            ln -sfn "$FLAVOR" "$SRCROOT/../shared/build/XCFrameworks/current"
  YoinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YoinTests
    dependencies:
      - target: Yoin
      # Headers only: the app already links YoinShared statically.
      - framework: ../shared/build/XCFrameworks/current/YoinShared.xcframework
        embed: false
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.tests
  # Spotify QA against scripts/fake_spotify.py (docs/qa-script.md): its own scheme, never part of
  # the Yoin scheme's tests (it needs the fake server and writes screenshots to /tmp/yoin-spotify-qa).
  YoinSpotifyQA:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YoinSpotifyQA
    dependencies:
      - target: Yoin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.spotifyqa
        TEST_TARGET_NAME: Yoin
    scheme:
      testTargets:
        - YoinSpotifyQA
