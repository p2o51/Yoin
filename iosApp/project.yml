name: Yoin
options:
  bundleIdPrefix: com.gpo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  Yoin:
    type: application
    platform: iOS
    sources:
      - path: Yoin
    # YoinShared: the Kotlin Multiplatform :shared module (MCU, Palette,
    # YoinTokens, layout / colour algorithms) as a static XCFramework.
    # docs/shared-kmp.md.
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/YoinShared.xcframework
        embed: false
    preBuildScripts:
      # The scheme's build pre-action (below) runs Gradle before Xcode plans
      # the build; this phase only fails the build when the framework is
      # older than a Kotlin source (a failed or skipped Gradle run).
      - name: Check YoinShared (Kotlin) is current
        basedOnDependencyAnalysis: false
        script: |
          if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
          FW="$SRCROOT/../shared/build/XCFrameworks/debug/YoinShared.xcframework/Info.plist"
          if [ ! -f "$FW" ]; then
            echo "error: YoinShared.xcframework is missing. Run ./gradlew :shared:assembleYoinSharedDebugXCFramework (iosApp/docs/shared-kmp.md)."
            exit 1
          fi
          NEWER=$(find "$SRCROOT/../shared/src" "$SRCROOT/../shared/build.gradle.kts" -newer "$FW" -type f | head -1)
          if [ -n "$NEWER" ]; then
            echo "error: YoinShared.xcframework is older than $NEWER. Run ./gradlew :shared:assembleYoinSharedDebugXCFramework, or build again (the scheme pre-action runs it)."
            exit 1
          fi
    info:
      path: Yoin/Info.plist
      properties:
        CFBundleDisplayName: Yoin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - google_sans_flex_400.ttf
          - google_sans_flex_500.ttf
          - google_sans_flex_600.ttf
          - google_sans_flex_700.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin
        # The YoinShared check reads ../shared outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - YoinTests
      # Rebuilds ../shared/build/XCFrameworks/debug/YoinShared.xcframework
      # before Xcode plans the build (Gradle skips it when :shared is
      # unchanged). YOIN_SKIP_SHARED_BUILD=1 links the framework as is.
      preActions:
        - name: Build YoinShared (Kotlin)
          settingsTarget: Yoin
          script: |
            if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
            if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
            mkdir -p "$SRCROOT/build"
            cd "$SRCROOT/.." && ./gradlew --quiet :shared:assembleYoinSharedDebugXCFramework > "$SRCROOT/build/yoin-shared-gradle.log" 2>&1
  YoinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YoinTests
    dependencies:
      - target: Yoin
      # Headers only: the app already links YoinShared statically.
      - framework: ../shared/build/XCFrameworks/debug/YoinShared.xcframework
        embed: false
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.tests
