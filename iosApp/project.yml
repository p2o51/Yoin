name: Yoin
options:
  bundleIdPrefix: com.gpo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  # Google Sign-In for Cloud sync (scope drive.appdata only). Client ID: Config/GoogleSignIn.xcconfig.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
  # Spotify App Remote (playback through the Spotify app), pinned: a binary SDK.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Simulator builds sign ad hoc ("-", no provisioning): enough for the App Group entitlement the
    # widgets share data through. Device builds sign automatically with 51's development team (a team ID,
    # not a secret).
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
    DEVELOPMENT_TEAM: M75T74PTC4
    CODE_SIGN_STYLE: Automatic
    # One version for the app and its widget extension (they must match); a new build bumps this line only.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "30"
targets:
  Yoin:
    type: application
    platform: iOS
    sources:
      - path: Yoin
    # YoinShared: the Kotlin Multiplatform :shared module (MCU, Palette,
    # YoinTokens, layout / colour algorithms) as a static XCFramework.
    # docs/shared-kmp.md.
    dependencies:
      - framework: ../shared/build/XCFrameworks/current/YoinShared.xcframework
        embed: false
      - target: YoinWidgets
        embed: true
        codeSign: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: SpotifyiOS
        product: SpotifyiOS
    configFiles:
      Debug: Config/GoogleSignIn.xcconfig
      Release: Config/GoogleSignIn.xcconfig
    preBuildScripts:
      # The scheme's build pre-action (below) runs Gradle before Xcode plans
      # the build; this phase only fails the build when the framework is
      # older than a Kotlin source (a failed or skipped Gradle run).
      - name: Check YoinShared (Kotlin) is current
        basedOnDependencyAnalysis: false
        script: |
          if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
          FW="$SRCROOT/../shared/build/XCFrameworks/current/YoinShared.xcframework/Info.plist"
          if [ ! -f "$FW" ]; then
            echo "error: YoinShared.xcframework is missing. Build once from Xcode (the scheme pre-action runs Gradle), or see iosApp/docs/shared-kmp.md."
            exit 1
          fi
          NEWER=$(find "$SRCROOT/../shared/src" "$SRCROOT/../shared/build.gradle.kts" -newer "$FW" -type f | head -1)
          if [ -n "$NEWER" ]; then
            echo "error: YoinShared.xcframework is older than $NEWER. Build again (the scheme pre-action runs Gradle), or see iosApp/docs/shared-kmp.md."
            exit 1
          fi
    # The App Group the widget extension reads its snapshot from (Widgets/WidgetSnapshot.swift).
    entitlements:
      path: Yoin/Yoin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gpo.yoin
    info:
      path: Yoin/Info.plist
      properties:
        # "Open in Yoin" for a Spotoolfy export (JSON): the welcome guide's Spotoolfy step takes it.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Spotoolfy export
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        LSSupportsOpeningDocumentsInPlace: false
        # Handoff of what's playing (App/PlayingHandoff.swift), the native Mac's activity type.
        NSUserActivityTypes:
          - com.gpo.yoin.playing
        # Songs, albums and playlists dragged inside Yoin (Library/YoinDrag.swift; the native Mac's type).
        # Other apps get their plain text.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.gpo.yoin.item
            UTTypeDescription: Yoin item
            UTTypeConformsTo:
              - public.data
        CFBundleDisplayName: Yoin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS and Apple's own crypto: no export compliance paperwork per build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # One window, on iPad and on a Mac: every scene would share AppModel.shared, so a second window
        # only mirrored the first (docs/ipad.md).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A pointer's clicks arrive as indirect-pointer touches with their button mask (an iPad with a
        # mouse or trackpad, the iPad app on a Mac). Without it they are plain direct touches and a
        # right-click can't be told from a tap (Theme/SecondaryClick.swift).
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - google_sans_flex_400.ttf
          - google_sans_flex_500.ttf
          - google_sans_flex_600.ttf
          - google_sans_flex_700.ttf
        # Native playback keeps playing with the screen off / app in the background.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # Self-hosted Subsonic / Navidrome servers are often plain http on a
          # LAN or a home IP, entered by the user at runtime, so ATS can't list
          # them ahead of time: allow arbitrary loads (plus local networking).
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Yoin streams music from servers on your local network.
        # MusicKit's authorization prompt (Apple Music library, catalog and playback).
        NSAppleMusicUsageDescription: Yoin plays and shows your Apple Music library.
        # Cloud sync's Google sign-in (Config/GoogleSignIn.xcconfig).
        GIDClientID: $(YOIN_GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(YOIN_GOOGLE_IOS_REVERSED_CLIENT_ID)
          # Spotify's sign-in and App Remote return here (yoin://auth/spotify/…, as on Android).
          - CFBundleURLName: com.gpo.yoin.auth
            CFBundleURLSchemes:
              - yoin
        # App Remote checks for (and opens) the Spotify app.
        LSApplicationQueriesSchemes:
          - spotify
        # The dev build's Spotify Client ID (Config/Spotify.local.xcconfig, not in git, as
        # Android's local.properties); Settings › Spotify overrides it at runtime.
        YoinSpotifyClientID: $(YOIN_SPOTIFY_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin
        # The YoinShared check reads ../shared outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # YoinShared has iosArm64 + iosSimulatorArm64 slices only (no Intel
        # simulator), so generic simulator builds skip x86_64.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - YoinTests
      # Rebuilds ../shared/build/XCFrameworks/<debug or release>/YoinShared.xcframework
      # before Xcode plans the build (Gradle skips it when :shared is
      # unchanged). YOIN_SKIP_SHARED_BUILD=1 links the framework as is.
      preActions:
        - name: Build YoinShared (Kotlin)
          settingsTarget: Yoin
          script: |
            if [ "${YOIN_SKIP_SHARED_BUILD:-0}" = "1" ]; then exit 0; fi
            if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
            mkdir -p "$SRCROOT/build"
            # Release / Archive link the release framework, everything else the
            # debug one; Xcode always links XCFrameworks/current (a symlink).
            if [ "$CONFIGURATION" = "Release" ]; then FLAVOR=release; TASK=assembleYoinSharedReleaseXCFramework
            else FLAVOR=debug; TASK=assembleYoinSharedDebugXCFramework; fi
            cd "$SRCROOT/.." && ./gradlew --quiet ":shared:$TASK" > "$SRCROOT/build/yoin-shared-gradle.log" 2>&1
            ln -sfn "$FLAVOR" "$SRCROOT/../shared/build/XCFrameworks/current"
  # Home screen widgets (Play, Memory): they only read the app's snapshot in the App Group.
  YoinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YoinWidgets
      - path: Yoin/Widgets/WidgetSnapshot.swift
      - path: Yoin/Widgets/WidgetIntents.swift
      - path: Yoin/Localizable.xcstrings
    entitlements:
      path: YoinWidgets/YoinWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gpo.yoin
    info:
      path: YoinWidgets/Info.plist
      properties:
        CFBundleDisplayName: Yoin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SKIP_INSTALL: YES
  YoinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YoinTests
    dependencies:
      - target: Yoin
      # Headers only: the app already links YoinShared statically.
      - framework: ../shared/build/XCFrameworks/current/YoinShared.xcframework
        embed: false
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.tests
  # The Home avatar's tap and hold (needs the demo Subsonic servers on :5021 and :5022): its own scheme,
  # not part of the Yoin scheme's unit tests.
  YoinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YoinUITests
    dependencies:
      - target: Yoin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.uitests
        TEST_TARGET_NAME: Yoin
    scheme:
      testTargets:
        - YoinUITests
  # Spotify QA against scripts/fake_spotify.py (docs/qa-script.md): its own scheme, never part of
  # the Yoin scheme's tests (it needs the fake server and writes screenshots to /tmp/yoin-spotify-qa).
  YoinSpotifyQA:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YoinSpotifyQA
    dependencies:
      - target: Yoin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gpo.yoin.spotifyqa
        TEST_TARGET_NAME: Yoin
    scheme:
      testTargets:
        - YoinSpotifyQA
