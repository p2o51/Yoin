name: yoin
description: "Yoin for HarmonyOS"
publish_to: 'none'
version: 0.6.5+1

environment:
  sdk: ^3.11.5

dependencies:
  # Pure-Dart zip for Settings › Export all data / Import from backup. 3.x: 4.x pulls in posix (FFI).
  archive: ^3.6.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by the Flutter SDK; ColorScheme.fromSeed uses it under the hood.
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  material_color_utilities: any
  # Yoin Symbols, built from the sibling checkout like the Android app (AGENTS.md "Icons").
  pinyin: ^3.3.0
  yoin_symbols:
    path: ../../yoin-symbols/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Variable.ttf
