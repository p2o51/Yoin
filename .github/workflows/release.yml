name: Release

# Cut a release by pushing a tag:  git tag v0.5.1 && git push origin v0.5.1
# Builds a signed AAB + APK, attaches them to a GitHub Release, and (when the
# Play service-account secret is present) promotes the AAB to the internal track.
#
# Required repository secrets (see docs/ci-cd.md):
#   RELEASE_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   RELEASE_KEYSTORE_PASSWORD   keystore store password
#   RELEASE_KEY_ALIAS           key alias
#   RELEASE_KEY_PASSWORD        key password
# Optional:
#   SPOTIFY_CLIENT_ID           baked into the release build config
#   PLAY_SERVICE_ACCOUNT_JSON   enables the Google Play internal-track upload

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=(RELEASE_KEYSTORE_BASE64)
          [ -z "$STORE_PASSWORD" ] && missing+=(RELEASE_KEYSTORE_PASSWORD)
          [ -z "$KEY_ALIAS" ] && missing+=(RELEASE_KEY_ALIAS)
          [ -z "$KEY_PASSWORD" ] && missing+=(RELEASE_KEY_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Release signing requires these repository secrets: ${missing[*]}. See docs/ci-cd.md."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"

      - name: Build signed AAB + APK
        env:
          YOIN_RELEASE_KEYSTORE_PROPERTIES: ${{ runner.temp }}/keystore.properties
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PspotifyClientId="$SPOTIFY_CLIENT_ID"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk

      - name: Detect Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set — skipping Google Play upload."
          fi

      - name: Upload to Google Play (internal track)
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gpo.yoin
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
