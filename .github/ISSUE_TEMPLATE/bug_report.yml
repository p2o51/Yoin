name: Bug report
description: Something isn't working as expected
labels: [ bug ]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Music source
      options:
        - Subsonic / OpenSubsonic
        - Spotify
        - Both / not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.5.0 (versionCode 5)"
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: text
